<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">IAS 通用计算机的逻辑结构</title>
  <desc id="desc">存储器、控制器、算术器、输入输出与外部记录介质之间的数据和指令通路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.6; rx: 10; }
      .core { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; }
      .ctrl { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .io { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .label { font: 600 18px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .edge { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge2 { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 5; }
      .edge-label { font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .note { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .title { font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <text class="title" x="30" y="38">IAS 通用计算机：逻辑结构与主要通路</text>
  <text class="note" x="30" y="62">有限硬件 + 可更换的存储程序 = 通用计算</text>

  <!-- Memory -->
  <rect class="box core" x="330" y="90" width="270" height="100"/>
  <text class="label" x="465" y="120" text-anchor="middle">快速存储器 M</text>
  <text class="small" x="465" y="145" text-anchor="middle">4096 × 40 位字</text>
  <text class="small" x="465" y="166" text-anchor="middle">数 + 成对指令</text>

  <!-- Control -->
  <rect class="box ctrl" x="80" y="330" width="220" height="105"/>
  <text class="label" x="190" y="360" text-anchor="middle">控制器 CC</text>
  <text class="small" x="190" y="385" text-anchor="middle">FR / CR / CC</text>
  <text class="small" x="190" y="407" text-anchor="middle">取指 · 译码 · 定序</text>

  <!-- Arithmetic -->
  <rect class="box core" x="350" y="330" width="240" height="105"/>
  <text class="label" x="470" y="360" text-anchor="middle">算术器</text>
  <text class="small" x="470" y="385" text-anchor="middle">SR → Ac / AR</text>
  <text class="small" x="470" y="407" text-anchor="middle">加 · 减 · 乘 · 除 · 移位</text>

  <!-- IO -->
  <rect class="box io" x="650" y="330" width="220" height="105"/>
  <text class="label" x="760" y="360" text-anchor="middle">输入 / 输出</text>
  <text class="small" x="760" y="385" text-anchor="middle">I / O · 磁线 · 纸带</text>
  <text class="small" x="760" y="407" text-anchor="middle">二级存储 / 人机接口</text>

  <!-- Memory <-> Control -->
  <path class="edge" d="M 330 150 C 250 150, 190 250, 190 330"/>
  <text class="edge-label" x="240" y="220">指令对</text>
  <path class="edge2" d="M 190 330 C 190 280, 260 200, 330 180"/>
  <text class="edge-label" x="214" y="270">地址 / 取指</text>

  <!-- Memory <-> Arithmetic -->
  <path class="edge" d="M 470 190 L 470 330"/>
  <text class="edge-label" x="480" y="260">数据 / 结果</text>
  <path class="edge2" d="M 500 330 C 500 300, 550 220, 600 180"/>
  <text class="edge-label" x="536" y="245">写回</text>

  <!-- Control -> Arithmetic -->
  <path class="edge" d="M 300 382 L 350 382"/>
  <text class="edge-label" x="310" y="373">控制信号</text>

  <!-- IO <-> Memory -->
  <path class="edge2" d="M 650 385 C 620 330, 620 220, 600 150"/>
  <text class="edge-label" x="606" y="285">块传送</text>

  <!-- IO <-> external -->
  <path class="edge" d="M 760 435 L 760 485"/>
  <text class="edge-label" x="770" y="468">外部记录介质 R</text>

  <text class="note" x="80" y="520">说明：箭头表示信息流；“控制信号”是控制器对算术器和 I/O 的操作命令。</text>
</svg>
